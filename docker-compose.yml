version: "3.8"

services:
  backend:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/carrental
      - JWT_SECRET=YOUR_SUPER_JWT_SECRET
      - GEMINI_API_KEY=YOUR_GEMINI_API_KEY
      - ADMIN_SECRET_CODE=MY_SUPER_SECRET_CODE
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis

  frontend:
    build: ./cilent
    ports:
      - "5173:5173"
    environment:
      - VITE_BASE_URL=http://localhost:3000
    depends_on:
      - backend

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  mongo-data:
